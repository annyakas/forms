<html>
    <head>
        <meta charset="UTF-8">
        <title>Formulário HTML</title>
    </head>
    <body>
        <h1>Formulário de Cadasro </h1>
        <form>
            <label>Nome:</label>
            <input type="text"> <br>

            <label>Senha:</label>
            <input type="password"> <br>

            <label>E-mail:</label>
            <input type="email"> <br>

            <label>Idade:</label>
            <input type="number"> <br>

            <label>Telefone ou site: </label>
            <input type="url"> <br>

            <label>Pesquisar:</label>
            <input type="search"> <br>

            <label>Data:</label>
            <input type="date"> <br>

            <label>Data e Hora:</label>
            <input type="datetime-local"> <br>

            <label>Mês:</label>
            <input type="month"> <br>

            <label>Semana:</label>
            <input type="week"> <br>

            <label>Horário:</label>
            <input type="time"> <br>

            <label>Cor Favorita:</label>
            <input type="color"> <br>
            
            <label>Idade em escala:</label>
            <input type="range"> <br>

            <label>Foto ou arquivo:</label>
            <input type="file"> <br>

            <label>Gênero:</label>
            <input type="radio" name="genero"> Feminino
            <input type="radio" name="genero"> Masculino
            <br>

            <label>Interesses:</label>
            <input type="checkbox"> Tecnologia
            <input type="checkbox"> Musica
            <br>

            <input type="hidden" name="codigo" value="123">

            <input type="image"
            src="https://blog.pluga.co/wp-content/uploads/2018/01/Google-Forms-como-funciona-1.svg"
            alt="Enviar" width="48" height="48">
            <br>

            <input type="button" value="Clique aqui"
            onclick="alert('Olá! seja bem-vindo ao meu site')">

            <input type="submit" value="Enviar formulário">

            <input type="reset" value="Limpar formulário">
        </form>
    </body>
</html>
